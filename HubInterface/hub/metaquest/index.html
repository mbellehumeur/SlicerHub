<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MetaQuest — Slicer Hub</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --fg: #e8eefc;
        --muted: #9aa8c7;
        --accent: #4ea1ff;
        --danger: #ff6b6b;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: absolute;
        left: 12px;
        top: 12px;
        right: 12px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        pointer-events: none;
      }
      #hud > * {
        pointer-events: auto;
      }
      #status {
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 14px;
        color: var(--muted);
        max-width: min(520px, 100%);
      }
      #status[data-tone='error'] {
        color: var(--danger);
      }
      #enterXr {
        appearance: none;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #041018;
        font-weight: 600;
        padding: 10px 14px;
        cursor: pointer;
      }
      #enterXr[hidden] {
        display: none;
      }
      #enterXr:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <div id="status">Connecting…</div>
        <button id="enterXr" type="button" hidden disabled>View in VR</button>
      </div>
    </div>
    <script type="module" src="./metaquest.js"></script>
  </body>
</html>
