<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="confTitle confDesc">
  <title id="confTitle">Hub conferencing (animated)</title>
  <desc id="confDesc">Animated overview: a host starts a conference from the worklist, invites colleagues on OHIF, VolView, Slim, and 3D Slicer, opens a study, and everyone sees the same case in real time through the Slicer hub.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b1b5f" flood-opacity="0.14"/>
    </filter>
    <symbol id="clinicianSeated" viewBox="0 0 52 76">
      <circle cx="26" cy="14" r="10" fill="#e8c4a0" stroke="#b8956e" stroke-width="1.2"/>
      <path d="M16 11 Q26 5 36 11 Q36 8 26 4 Q16 8 16 11" fill="#2c1810"/>
      <path d="M14 24 Q26 34 38 24" fill="none" stroke="#475569" stroke-width="1.5"/>
      <path d="M12 26 L12 58 L40 58 L40 26 L32 26 L30 34 L22 34 L20 26 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M22 34 L30 34 L28 42 L24 42 Z" fill="#0e7490"/>
      <circle cx="26" cy="50" r="3.5" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
      <rect x="18" y="58" width="16" height="6" rx="2" fill="#1e3a5f"/>
      <path d="M12 30 L5 44" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="4" cy="45" r="3" fill="#e8c4a0" stroke="#b8956e" stroke-width="1"/>
      <path d="M40 30 L47 44" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="48" cy="45" r="3" fill="#e8c4a0" stroke="#b8956e" stroke-width="1"/>
    </symbol>
    <style>
      .title { font: 700 38px Arial, Helvetica, sans-serif; fill: #06146b; }
      .heading { font: 700 24px Arial, Helvetica, sans-serif; fill: #06146b; }
      .label { font: 700 18px Arial, Helvetica, sans-serif; fill: #06146b; }
      .small { font: 16px Arial, Helvetica, sans-serif; fill: #334155; }
      .screenLabel { font: 600 10px Arial, Helvetica, sans-serif; fill: #94a3b8; }
      .panel { fill: #fff; stroke: #cfe0ff; stroke-width: 2; filter: url(#shadow); }
      .captionBox { fill: #06146b; opacity: 0.9; }
      .captionText { font: 700 13px Arial, Helvetica, sans-serif; fill: #fff; }
      .badge { font: 700 12px Arial, Helvetica, sans-serif; fill: #fff; }
      .packetText { font: 700 10px Arial, Helvetica, sans-serif; fill: #fff; }
      .conn { fill: none; stroke: #cbd5e1; stroke-width: 4; stroke-linecap: round; }

      #step1Caption { opacity: 0; animation: step1Caption 28s infinite; }
      @keyframes step1Caption {
        0%, 4% { opacity: 0; }
        6%, 22% { opacity: 1; }
        24%, 100% { opacity: 0; }
      }
      #step2Caption { opacity: 0; animation: step2Caption 28s infinite; }
      @keyframes step2Caption {
        0%, 22% { opacity: 0; }
        24%, 40% { opacity: 1; }
        42%, 100% { opacity: 0; }
      }
      #step3Caption { opacity: 0; animation: step3Caption 28s infinite; }
      @keyframes step3Caption {
        0%, 40% { opacity: 0; }
        42%, 58% { opacity: 1; }
        60%, 100% { opacity: 0; }
      }
      #step4Caption { opacity: 0; animation: step4Caption 28s infinite; }
      @keyframes step4Caption {
        0%, 58% { opacity: 0; }
        60%, 82% { opacity: 1; }
        84%, 100% { opacity: 0; }
      }
      #step5Caption { opacity: 0; animation: step5Caption 28s infinite; }
      @keyframes step5Caption {
        0%, 82% { opacity: 0; }
        84%, 96% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }

      #bridgeRing { opacity: 0; animation: bridgeRing 28s infinite; }
      @keyframes bridgeRing {
        0%, 22% { opacity: 0; }
        26%, 96% { opacity: 1; }
        100% { opacity: 0; }
      }
      #bridgeA, #bridgeB, #bridgeC, #bridgeD, #bridgeE { opacity: 0; animation: bridgeLines 28s infinite; }
      @keyframes bridgeLines {
        0%, 22% { opacity: 0; }
        26%, 96% { opacity: 1; }
        100% { opacity: 0; }
      }

      #lineHostHub { animation: lineHostHub 28s infinite; }
      @keyframes lineHostHub {
        0%, 54% { stroke: #cbd5e1; opacity: 0.45; }
        58%, 78% { stroke: #2457d6; opacity: 1; }
        82%, 100% { stroke: #cbd5e1; opacity: 0.45; }
      }
      #lineHubA, #lineHubB, #lineHubC, #lineHubD { animation: lineHubOut 28s infinite; }
      @keyframes lineHubOut {
        0%, 60% { stroke: #cbd5e1; opacity: 0.45; }
        64%, 80% { stroke: #2457d6; opacity: 1; }
        84%, 100% { stroke: #cbd5e1; opacity: 0.45; }
      }

      .packetHost { opacity: 0; animation: packetHost 28s infinite; }
      @keyframes packetHost {
        0%, 54% { opacity: 0; transform: translate(250px, 250px); }
        58% { opacity: 1; transform: translate(250px, 250px); }
        68% { opacity: 1; transform: translate(600px, 340px); }
        72%, 100% { opacity: 0; transform: translate(600px, 340px); }
      }
      .packetFanA { opacity: 0; animation: packetFanA 28s infinite; }
      @keyframes packetFanA {
        0%, 62% { opacity: 0; transform: translate(600px, 340px); }
        64% { opacity: 1; transform: translate(600px, 340px); }
        72% { opacity: 1; transform: translate(1065px, 123px); }
        74%, 100% { opacity: 0; transform: translate(1065px, 123px); }
      }
      .packetFanB { opacity: 0; animation: packetFanB 28s infinite; }
      @keyframes packetFanB {
        0%, 62% { opacity: 0; transform: translate(600px, 340px); }
        64% { opacity: 1; transform: translate(600px, 340px); }
        72% { opacity: 1; transform: translate(1065px, 238px); }
        74%, 100% { opacity: 0; transform: translate(1065px, 238px); }
      }
      .packetFanC { opacity: 0; animation: packetFanC 28s infinite; }
      @keyframes packetFanC {
        0%, 62% { opacity: 0; transform: translate(600px, 340px); }
        64% { opacity: 1; transform: translate(600px, 340px); }
        72% { opacity: 1; transform: translate(1065px, 353px); }
        74%, 100% { opacity: 0; transform: translate(1065px, 353px); }
      }
      .packetFanD { opacity: 0; animation: packetFanD 28s infinite; }
      @keyframes packetFanD {
        0%, 62% { opacity: 0; transform: translate(600px, 340px); }
        64% { opacity: 1; transform: translate(600px, 340px); }
        72% { opacity: 1; transform: translate(1065px, 468px); }
        74%, 100% { opacity: 0; transform: translate(1065px, 468px); }
      }

      #hostStudy, #attendeeAStudy, #attendeeBStudy, #attendeeCStudy, #attendeeDStudy { opacity: 0; animation: studyAppear 28s infinite; }
      @keyframes studyAppear {
        0%, 70% { opacity: 0; }
        74%, 96% { opacity: 0.95; }
        100% { opacity: 0; }
      }

      #hostBadge { opacity: 0; animation: hostBadge 28s infinite; }
      @keyframes hostBadge {
        0%, 22% { opacity: 0; }
        26%, 96% { opacity: 1; }
        100% { opacity: 0; }
      }

      #castHubGraphic { transform-origin: 0px 0px; animation: hubPulse 28s infinite; }
      @keyframes hubPulse {
        0%, 24% { transform: scale(1); }
        28%, 36% { transform: scale(1.06); }
        40%, 100% { transform: scale(1); }
      }
      #hubBroadcastArcs { opacity: 0.4; animation: hubBroadcastArcs 28s infinite; }
      @keyframes hubBroadcastArcs {
        0%, 22% { opacity: 0.4; }
        26%, 96% { opacity: 1; }
        100% { opacity: 0.4; }
      }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#ffffff"/>

  <text x="600" y="52" text-anchor="middle" class="title">Hub Conferencing</text>
  <text x="600" y="84" text-anchor="middle" class="small">Share the same case across workstations</text>

  <g id="step1Caption">
    <rect class="captionBox" x="210" y="108" width="780" height="44" rx="8"/>
    <text x="600" y="136" text-anchor="middle" class="captionText">Step 1: Each clinician works in their own viewer session</text>
  </g>
  <g id="step2Caption">
    <rect class="captionBox" x="210" y="108" width="780" height="44" rx="8"/>
    <text x="600" y="136" text-anchor="middle" class="captionText">Step 2: The host starts a conference and invites colleagues</text>
  </g>
  <g id="step3Caption">
    <rect class="captionBox" x="180" y="108" width="840" height="44" rx="8"/>
    <text x="600" y="136" text-anchor="middle" class="captionText">Step 3: The hub links their sessions for the duration of the meeting</text>
  </g>
  <g id="step4Caption">
    <rect class="captionBox" x="170" y="108" width="860" height="44" rx="8"/>
    <text x="600" y="136" text-anchor="middle" class="captionText">Step 4: When the host opens a study, everyone follows the same case</text>
  </g>
  <g id="step5Caption">
    <rect class="captionBox" x="190" y="108" width="820" height="44" rx="8"/>
    <text x="600" y="136" text-anchor="middle" class="captionText">Step 5: Navigation, images, and annotations stay in sync for the group</text>
  </g>

  <path id="lineHostHub" class="conn" d="M280 250 L520 330"/>
  <path id="lineHubA" class="conn" d="M680 330 L980 123"/>
  <path id="lineHubB" class="conn" d="M680 340 L980 238"/>
  <path id="lineHubC" class="conn" d="M680 350 L980 353"/>
  <path id="lineHubD" class="conn" d="M670 360 L980 468"/>

  <circle id="bridgeRing" cx="600" cy="340" r="132" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="10 8"/>
  <path id="bridgeA" d="M600 340 L280 250" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/>
  <path id="bridgeB" d="M600 340 L1065 123" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/>
  <path id="bridgeC" d="M600 340 L1065 238" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/>
  <path id="bridgeD" d="M600 340 L1065 353" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/>
  <path id="bridgeE" d="M600 340 L1065 468" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/>

  <g id="hostStation" transform="translate(80, 170)">
    <rect class="panel" x="0" y="0" width="240" height="128" rx="12"/>
    <text x="120" y="34" text-anchor="middle" class="label">Host</text>
    <text x="120" y="56" text-anchor="middle" class="small">Worklist</text>
    <rect id="hostStudy" x="42" y="68" width="156" height="48" rx="4" fill="#1d4ed8" stroke="#334155" stroke-width="1.5"/>
    <text x="120" y="98" text-anchor="middle" class="screenLabel">study list</text>
    <rect x="90" y="122" width="60" height="6" rx="2" fill="#94a3b8"/>
    <g id="hostBadge">
      <rect x="168" y="8" width="64" height="22" rx="11" fill="#7c3aed"/>
      <text x="200" y="23" text-anchor="middle" class="badge">LIVE</text>
    </g>
    <use href="#clinicianSeated" x="84" y="78" width="72" height="106"/>
  </g>

  <g id="attendeeA" transform="translate(980, 85)">
    <rect class="panel" x="0" y="0" width="170" height="76" rx="12"/>
    <text x="85" y="28" text-anchor="middle" class="label">OHIF</text>
    <rect id="attendeeAStudy" x="28" y="40" width="114" height="28" rx="3" fill="#1d4ed8" stroke="#334155" stroke-width="1.5"/>
    <text x="85" y="58" text-anchor="middle" class="screenLabel">viewer</text>
    <rect x="55" y="70" width="60" height="6" rx="2" fill="#94a3b8"/>
    <use href="#clinicianSeated" x="61" y="36" width="48" height="70"/>
  </g>

  <g id="attendeeB" transform="translate(980, 200)">
    <rect class="panel" x="0" y="0" width="170" height="76" rx="12"/>
    <text x="85" y="28" text-anchor="middle" class="label">VolView</text>
    <rect id="attendeeBStudy" x="28" y="40" width="114" height="28" rx="3" fill="#1d4ed8" stroke="#334155" stroke-width="1.5"/>
    <text x="85" y="58" text-anchor="middle" class="screenLabel">viewer</text>
    <rect x="55" y="70" width="60" height="6" rx="2" fill="#94a3b8"/>
    <use href="#clinicianSeated" x="61" y="36" width="48" height="70"/>
  </g>

  <g id="attendeeC" transform="translate(980, 315)">
    <rect class="panel" x="0" y="0" width="170" height="76" rx="12"/>
    <text x="85" y="28" text-anchor="middle" class="label">Slim</text>
    <rect id="attendeeCStudy" x="28" y="40" width="114" height="28" rx="3" fill="#1d4ed8" stroke="#334155" stroke-width="1.5"/>
    <text x="85" y="58" text-anchor="middle" class="screenLabel">viewer</text>
    <rect x="55" y="70" width="60" height="6" rx="2" fill="#94a3b8"/>
    <use href="#clinicianSeated" x="61" y="36" width="48" height="70"/>
  </g>

  <g id="attendeeD" transform="translate(980, 430)">
    <rect class="panel" x="0" y="0" width="170" height="76" rx="12"/>
    <text x="85" y="28" text-anchor="middle" class="label">3D Slicer</text>
    <rect id="attendeeDStudy" x="28" y="40" width="114" height="28" rx="3" fill="#1d4ed8" stroke="#334155" stroke-width="1.5"/>
    <text x="85" y="58" text-anchor="middle" class="screenLabel">viewer</text>
    <rect x="55" y="70" width="60" height="6" rx="2" fill="#94a3b8"/>
    <use href="#clinicianSeated" x="61" y="36" width="48" height="70"/>
  </g>

  <g id="castHub">
    <text x="648" y="318" text-anchor="start" class="heading">Hub</text>
  </g>
  <g transform="translate(600, 340)">
    <g id="castHubGraphic">
      <g transform="rotate(-42)">
        <g id="hubBroadcastArcs" fill="none" stroke="#38bdf8" stroke-linecap="round">
          <path d="M30 -12 A 14 14 0 0 1 30 12" stroke-width="3"/>
          <path d="M38 -20 A 22 22 0 0 1 38 20" stroke-width="2.5" opacity="0.8"/>
          <path d="M46 -28 A 30 30 0 0 1 46 28" stroke-width="2" opacity="0.55"/>
        </g>
        <g id="hubDish">
          <circle cx="0" cy="0" r="20" fill="#e0f2fe" stroke="#1e40af" stroke-width="4"/>
        </g>
      </g>
    </g>
  </g>

  <g class="packetHost">
    <rect x="-34" y="-12" width="68" height="24" rx="6" fill="#2457d6" stroke="#1e40af" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" class="packetText">open study</text>
  </g>
  <g class="packetFanA">
    <rect x="-28" y="-10" width="56" height="20" rx="5" fill="#2457d6" stroke="#1e40af" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" class="packetText">sync</text>
  </g>
  <g class="packetFanB">
    <rect x="-28" y="-10" width="56" height="20" rx="5" fill="#2457d6" stroke="#1e40af" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" class="packetText">sync</text>
  </g>
  <g class="packetFanC">
    <rect x="-28" y="-10" width="56" height="20" rx="5" fill="#2457d6" stroke="#1e40af" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" class="packetText">sync</text>
  </g>
  <g class="packetFanD">
    <rect x="-28" y="-10" width="56" height="20" rx="5" fill="#2457d6" stroke="#1e40af" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" class="packetText">sync</text>
  </g>

  <g transform="translate(120, 590)">
    <text x="0" y="0" class="small">Tumor board, case review, or live teaching</text>
    <text x="0" y="22" class="small">- everyone sees what the group is discussing</text>
  </g>
</svg>
